<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сканер сроков годности</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
            will-change: transform;
        }
        
        #reader { width: 100vw; height: 100vh; position: relative; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
        
        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            pointer-events: none;
            z-index: 10;
            will-change: transform;
        }
        
        .scan-frame {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 3px solid rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
        }
        
        .scan-corner {
            position: absolute;
            width: 25px;
            height: 25px;
            border: 4px solid #4caf50;
        }
        .scan-corner.top-left { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
        .scan-corner.top-right { top: -2px; right: -2px; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
        .scan-corner.bottom-left { bottom: -2px; left: -2px; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
        .scan-corner.bottom-right { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 8px 0; }
        
        .scan-line {
            position: absolute;
            top: 50%; left: 10%; right: 10%;
            height: 2px;
            background: #4caf50;
            animation: scan 1.5s ease-in-out infinite;
            will-change: transform;
        }
        @keyframes scan {
            0%, 100% { transform: translateY(-60px); }
            50% { transform: translateY(60px); }
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 8px;
            width: 95%;
            max-width: 500px;
        }
        
        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .btn-start { background: #4caf50; }
        .btn-stop { background: #f44336; }
        .btn-flash { background: #ff9800; }
        .btn-manual { background: #9c27b0; }
        
        .status-bar {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 10px 16px;
            border-radius: 15px;
            font-size: 13px;
        }
        
        .result-notification {
            position: fixed;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 12px 18px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            z-index: 200;
            display: none;
            min-width: 220px;
        }
        .result-notification.show { display: block; }
        
        .result-header { display: flex; align-items: center; gap: 10px; }
        
        .result-color {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .result-color.green { background: #4caf50; }
        .result-color.yellow { background: #ff9800; }
        .result-color.red { background: #f44336; }
        
        .result-info { flex: 1; }
        .result-title { font-size: 14px; font-weight: bold; }
        .result-date { color: #666; font-size: 12px; }
        .result-days { color: #999; font-size: 11px; }
        
        .recent-list {
            position: fixed;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border-radius: 10px;
            z-index: 100;
            font-size: 11px;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            width: 110px;
        }
        .recent-list.show { display: block; }
        .recent-item {
            padding: 5px;
            margin-bottom: 5px;
            border-radius: 5px;
            border-left: 3px solid;
        }
        .recent-item.green { background: #e8f5e9; border-color: #4caf50; }
        .recent-item.yellow { background: #fff3e0; border-color: #ff9800; }
        .recent-item.red { background: #ffebee; border-color: #f44336; }
        .recent-gtin { font-size: 9px; color: #999; word-break: break-all; }
        
        .stats-panel {
            position: fixed;
            top: 65px;
            right: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border-radius: 10px;
            z-index: 100;
            font-size: 12px;
            display: none;
        }
        .stats-panel.show { display: block; }
        .stat-item { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 5px; }
        .stat-item:last-child { margin-bottom: 0; }
        .stat-label { color: #666; }
        .stat-value { font-weight: bold; }
        .stat-value.red { color: #f44336; }
        .stat-value.yellow { color: #ff9800; }
        
        .db-indicator {
            position: fixed;
            top: 15px;
            left: 10px;
            background: rgba(156, 39, 176, 0.95);
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            z-index: 100;
            display: none;
            cursor: pointer;
        }
        .db-indicator.show { display: block; }
        
        .hint {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            z-index: 100;
            text-align: center;
        }
        
        .zoom-controls {
            position: fixed;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .zoom-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .manual-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 18px;
            border-radius: 12px;
            z-index: 300;
            display: none;
            min-width: 260px;
            max-width: 90%;
        }
        .manual-modal.show { display: block; }
        .manual-modal h3 { margin-bottom: 10px; font-size: 15px; }
        .manual-modal label { display: block; margin-bottom: 3px; font-size: 12px; color: #666; }
        .manual-modal input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .manual-modal .modal-buttons { display: flex; gap: 6px; }
        .manual-modal .modal-buttons button { flex: 1; padding: 8px; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; color: white; }
        .btn-confirm { background: #4caf50; }
        .btn-cancel { background: #9e9e9e; }
        .db-hint { 
            background: #e3f2fd; 
            padding: 6px; 
            border-radius: 5px; 
            font-size: 11px; 
            color: #1976d2; 
            margin-bottom: 10px;
            display: none;
        }
        .db-hint.show { display: block; }
        
        .overlay-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 250;
            display: none;
        }
        .overlay-bg.show { display: block; }
        
        .db-view-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 18px;
            border-radius: 12px;
            z-index: 300;
            display: none;
            min-width: 280px;
            max-width: 90%;
            max-height: 70vh;
            overflow-y: auto;
        }
        .db-view-modal.show { display: block; }
        .db-view-modal h3 { margin-bottom: 10px; font-size: 15px; }
        .db-entry {
            padding: 6px;
            margin-bottom: 5px;
            background: #f5f5f5;
            border-radius: 5px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .db-entry-gtin { font-family: monospace; font-size: 11px; color: #333; }
        .db-entry-date { color: #666; }
        .db-entry-delete {
            background: #f44336;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 3px 6px;
            font-size: 10px;
            cursor: pointer;
        }
        .db-empty { text-align: center; color: #999; padding: 15px; }
        .db-view-buttons { display: flex; gap: 6px; margin-top: 10px; }
        .db-view-buttons button { flex: 1; padding: 8px; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; color: white; }
        .btn-clear-db { background: #f44336; }
        .btn-close-db { background: #9e9e9e; }
        .db-import-export { margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd; }
        .db-import-export button, .db-import-export label { 
            display: block; 
            width: 100%; 
            padding: 10px; 
            color: white; 
            border-radius: 6px; 
            font-size: 13px; 
            cursor: pointer; 
            text-align: center;
            border: none;
            margin-bottom: 8px;
        }
        .btn-export { background: #2196f3; }
        .btn-import { background: #4caf50; }
        
        .timer {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            z-index: 100;
            display: none;
            margin-top: 40px;
        }
        .timer.show { display: block; }
    </style>
</head>
<body>
    <div id="reader"></div>
    
    <div class="scan-overlay" id="scanOverlay" style="display: none;">
        <div class="scan-frame"></div>
        <div class="scan-corner top-left"></div>
        <div class="scan-corner top-right"></div>
        <div class="scan-corner bottom-left"></div>
        <div class="scan-corner bottom-right"></div>
        <div class="scan-line"></div>
    </div>
    
    <div class="status-bar" id="statusBar">Нажмите "Включить"</div>
    
    <div class="timer" id="timer">⏱️ 00:00</div>
    
    <div class="db-indicator" id="dbIndicator">💾 База: 0</div>
    
    <div class="hint" id="hint" style="display: none;">
        📏 15-25 см | 💡 Вспышка
    </div>
    
    <div class="recent-list" id="recentList"></div>
    
    <div class="stats-panel" id="statsPanel">
        <div class="stat-item">
            <span class="stat-label">Всего:</span>
            <span class="stat-value" id="totalCount">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Просрочено:</span>
            <span class="stat-value red" id="expiredCount">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Скоро:</span>
            <span class="stat-value yellow" id="warningCount">0</span>
        </div>
    </div>
    
    <div class="zoom-controls" id="zoomControls" style="display: none;">
        <button class="zoom-btn" onclick="changeZoom(0.5)">+</button>
        <button class="zoom-btn" onclick="changeZoom(-0.5)">−</button>
    </div>
    
    <div class="result-notification" id="resultNotification">
        <div class="result-header">
            <div class="result-color" id="resultColor"></div>
            <div class="result-info">
                <div class="result-title" id="resultTitle"></div>
                <div class="result-date" id="resultDate"></div>
                <div class="result-days" id="resultDays"></div>
            </div>
        </div>
    </div>
    
    <div class="controls">
        <button class="action-btn btn-start" id="startBtn" onclick="toggleScan()">📷 Включить</button>
        <button class="action-btn btn-flash" id="flashBtn" onclick="toggleFlash()" style="display: none;">💡</button>
        <button class="action-btn btn-manual" id="manualBtn" onclick="openManual()" style="display: none;">✏️</button>
    </div>
    
    <div class="overlay-bg" id="overlayBg"></div>
    
    <div class="manual-modal" id="manualModal">
        <h3>✏️ Ввести срок годности</h3>
        <div class="db-hint" id="dbHint">✅ Этот GTIN уже в базе!</div>
        <label>GTIN товара:</label>
        <input type="text" id="manualGtin" placeholder="0460060503352">
        <label>Срок годности (ДД.ММ.ГГГГ):</label>
        <input type="text" id="manualDate" placeholder="25.07.2026">
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeManual()">Отмена</button>
            <button class="btn-confirm" onclick="saveManual()">Сохранить</button>
        </div>
    </div>
    
    <div class="db-view-modal" id="dbViewModal">
        <h3>💾 База данных товаров</h3>
        <div id="dbViewContent"></div>
        <div class="db-view-buttons">
            <button class="btn-clear-db" onclick="clearDatabase()">️ Очистить всё</button>
            <button class="btn-close-db" onclick="closeDbView()">Закрыть</button>
        </div>
        <div class="db-import-export">
            <button class="btn-export" onclick="exportDatabase()">💾 Экспорт базы</button>
            <label class="btn-import">
                📂 Импорт базы
                <input type="file" accept=".json" onchange="importDatabase(event)" style="display: none;">
            </label>
        </div>
    </div>

    <script>
        // Кэширование DOM элементов для производительности
        const DOM = {
            reader: document.getElementById('reader'),
            scanOverlay: document.getElementById('scanOverlay'),
            statusBar: document.getElementById('statusBar'),
            timer: document.getElementById('timer'),
            dbIndicator: document.getElementById('dbIndicator'),
            hint: document.getElementById('hint'),
            recentList: document.getElementById('recentList'),
            statsPanel: document.getElementById('statsPanel'),
            zoomControls: document.getElementById('zoomControls'),
            resultNotification: document.getElementById('resultNotification'),
            resultColor: document.getElementById('resultColor'),
            resultTitle: document.getElementById('resultTitle'),
            resultDate: document.getElementById('resultDate'),
            resultDays: document.getElementById('resultDays'),
            startBtn: document.getElementById('startBtn'),
            flashBtn: document.getElementById('flashBtn'),
            manualBtn: document.getElementById('manualBtn'),
            overlayBg: document.getElementById('overlayBg'),
            manualModal: document.getElementById('manualModal'),
            dbViewModal: document.getElementById('dbViewModal'),
            dbViewContent: document.getElementById('dbViewContent'),
            dbHint: document.getElementById('dbHint'),
            manualGtin: document.getElementById('manualGtin'),
            manualDate: document.getElementById('manualDate'),
            totalCount: document.getElementById('totalCount'),
            expiredCount: document.getElementById('expiredCount'),
            warningCount: document.getElementById('warningCount')
        };

        let html5QrcodeScanner;
        let isScanning = false;
        let scannedItems = [];
        let currentZoom = 1;
        let isFlashOn = false;
        let lastScannedCode = null;
        let timerInterval;
        let startTime;
        let resultTimeout;
        
        let gtinDatabase = {};
        try {
            const saved = localStorage.getItem('gtinDatabase');
            if (saved) gtinDatabase = JSON.parse(saved);
        } catch(e) {}
        
        function normalizeGTIN(gtin) {
            if (!gtin) return '';
            return gtin.replace(/\s/g, '').replace(/^0+/, '') || '0';
        }

        function showStatus(message) {
            DOM.statusBar.textContent = message;
        }

        function updateDbIndicator() {
            const count = Object.keys(gtinDatabase).length;
            DOM.dbIndicator.textContent = `💾 База: ${count}`;
            if (count > 0) DOM.dbIndicator.classList.add('show');
            else DOM.dbIndicator.classList.remove('show');
        }

        function extractGTIN(rawData) {
            const match14 = rawData.match(/01(\d{14})/);
            if (match14) return match14[1];
            const match13 = rawData.match(/01(\d{13})/);
            if (match13) return match13[1];
            const matchAny = rawData.match(/(\d{13,14})/);
            if (matchAny) return matchAny[1];
            return null;
        }

        function parseDataMatrix(rawData) {
            // Оптимизированный парсинг - ищем только нужные теги
            const match17 = rawData.match(/17(\d{6})/);
            if (match17) {
                const dateStr = match17[1];
                const year = parseInt(dateStr.substr(0, 2)) + 2000;
                const month = parseInt(dateStr.substr(2, 2)) - 1;
                const day = parseInt(dateStr.substr(4, 2));
                return { date: new Date(year, month, day), source: 'тег 17' };
            }
            
            const match91 = rawData.match(/91(\d{6})/);
            if (match91) {
                const dateStr = match91[1];
                const year = parseInt(dateStr.substr(0, 2)) + 2000;
                const month = parseInt(dateStr.substr(2, 2)) - 1;
                const day = parseInt(dateStr.substr(4, 2));
                if (year >= 2020 && year <= 2030 && month >= 0 && month <= 11 && day >= 1 && day <= 31) {
                    return { date: new Date(year, month, day), source: 'тег 91' };
                }
            }
            
            // Поиск в базе
            const rawGtin = extractGTIN(rawData);
            if (rawGtin) {
                const normalizedGtin = normalizeGTIN(rawGtin);
                for (const dbGtin in gtinDatabase) {
                    if (normalizeGTIN(dbGtin) === normalizedGtin) {
                        const parts = gtinDatabase[dbGtin].split('.');
                        if (parts.length === 3) {
                            const day = parseInt(parts[0]);
                            const month = parseInt(parts[1]) - 1;
                            const year = parseInt(parts[2]);
                            return { date: new Date(year, month, day), source: 'база', gtin: dbGtin };
                        }
                    }
                }
            }
            
            return null;
        }

        function getColorStatus(expirationDate) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const diffTime = expirationDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays <= 0) return { color: 'red', label: '🔴 Просрочен', emoji: '🔴', class: 'red', days: diffDays };
            else if (diffDays <= 2) return { color: 'yellow', label: '⚠️ Истекает', emoji: '⚠️', class: 'yellow', days: diffDays };
            else return { color: 'green', label: ' Нормально', emoji: '✅', class: 'green', days: diffDays };
        }

        async function toggleScan() {
            if (isScanning) stopScanning();
            else await startScanning();
        }

        async function startScanning() {
            if (typeof Html5Qrcode === 'undefined') {
                showStatus('️ Библиотека не загружена');
                return;
            }
            
            showStatus(' Запуск...');
            
            try {
                isScanning = true;
                scannedItems = [];
                updateStats();
                updateRecentList();
                updateDbIndicator();
                
                DOM.startBtn.textContent = '⏹️';
                DOM.startBtn.classList.remove('btn-start');
                DOM.startBtn.classList.add('btn-stop');
                DOM.scanOverlay.style.display = 'block';
                DOM.hint.style.display = 'block';
                DOM.statsPanel.classList.add('show');
                DOM.recentList.classList.add('show');
                DOM.zoomControls.style.display = 'flex';
                DOM.flashBtn.style.display = 'block';
                DOM.manualBtn.style.display = 'block';
                DOM.timer.classList.add('show');
                
                startTime = new Date();
                timerInterval = setInterval(() => {
                    const diff = Math.floor((new Date() - startTime) / 1000);
                    const minutes = Math.floor(diff / 60).toString().padStart(2, '0');
                    const seconds = (diff % 60).toString().padStart(2, '0');
                    DOM.timer.textContent = `⏱️ ${minutes}:${seconds}`;
                }, 1000);
                
                html5QrcodeScanner = new Html5Qrcode("reader");
                
                const config = { 
                    fps: 30,
                    qrbox: { width: 150, height: 150 },
                    aspectRatio: 1.0,
                    disableFlip: false,
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.DATA_MATRIX
                    ],
                    videoConstraints: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: 30 },
                        focusMode: 'continuous',
                        advanced: [
                            { zoom: currentZoom }
                        ]
                    }
                };
                
                await html5QrcodeScanner.start(
                    { facingMode: "environment" },
                    config,
                    onScanSuccess,
                    onScanFailure
                );
                
                const dbCount = Object.keys(gtinDatabase).length;
                showStatus(`✅ Сканируйте (база: ${dbCount})`);
                
            } catch (err) {
                console.error('Ошибка:', err);
                isScanning = false;
                DOM.startBtn.textContent = '📷 Включить';
                showStatus('❌ ' + err.message);
            }
        }

        function stopScanning() {
            isScanning = false;
            clearInterval(timerInterval);
            
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => { 
                    html5QrcodeScanner.clear(); 
                    html5QrcodeScanner = null;
                });
            }
            
            DOM.startBtn.textContent = '📷 Включить';
            DOM.startBtn.classList.remove('btn-stop');
            DOM.startBtn.classList.add('btn-start');
            DOM.scanOverlay.style.display = 'none';
            DOM.hint.style.display = 'none';
            DOM.statsPanel.classList.remove('show');
            DOM.recentList.classList.remove('show');
            DOM.zoomControls.style.display = 'none';
            DOM.flashBtn.style.display = 'none';
            DOM.manualBtn.style.display = 'none';
            DOM.timer.classList.remove('show');
            showStatus('Остановлено');
        }

        function changeZoom(delta) {
            currentZoom += delta;
            if (currentZoom < 1) currentZoom = 1;
            if (currentZoom > 3) currentZoom = 3;
            showStatus(`🔍 ${currentZoom.toFixed(1)}x`);
            
            if (html5QrcodeScanner) {
                try {
                    html5QrcodeScanner.applyVideoConstraints({
                        advanced: [{ zoom: currentZoom }]
                    });
                } catch(e) {}
            }
        }

        function toggleFlash() {
            isFlashOn = !isFlashOn;
            
            if (html5QrcodeScanner) {
                try {
                    html5QrcodeScanner.applyVideoConstraints({
                        advanced: [{ torch: isFlashOn }]
                    });
                } catch(e) {}
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Защита от дубликатов
            if (lastScannedCode === decodedText) return;
            lastScannedCode = decodedText;
            setTimeout(() => { lastScannedCode = null; }, 1000);
            
            const gtin = extractGTIN(decodedText);
            const parsed = parseDataMatrix(decodedText);
            
            if (parsed) {
                const status = getColorStatus(parsed.date);
                const item = { 
                    code: decodedText, 
                    gtin: parsed.gtin || gtin,
                    date: parsed.date, 
                    status: status, 
                    source: parsed.source,
                    time: new Date() 
                };
                scannedItems.push(item);
                showNotification(item);
                updateStats();
                updateRecentList();
                
                if (navigator.vibrate) {
                    if (status.color === 'red') navigator.vibrate([200, 100, 200]);
                    else if (status.color === 'yellow') navigator.vibrate(100);
                    else navigator.vibrate(50);
                }
                
                playBeep(status.color);
            } else {
                showStatus('📦 Дата не найдена → ✏️');
                if (gtin) {
                    DOM.manualGtin.value = gtin;
                }
                setTimeout(() => { 
                    if (isScanning) {
                        const dbCount = Object.keys(gtinDatabase).length;
                        showStatus(`✅ Сканируйте (база: ${dbCount})`);
                    }
                }, 1500);
            }
        }

        function onScanFailure(error) { }

        function showNotification(item) {
            const dateStr = item.date.toLocaleDateString('ru-RU');
            
            DOM.resultColor.className = 'result-color ' + item.status.class;
            DOM.resultColor.textContent = item.status.emoji;
            DOM.resultTitle.textContent = item.status.label;
            DOM.resultDate.textContent = dateStr;
            DOM.resultDays.textContent = item.status.days + ' дн.';
            
            DOM.resultNotification.classList.add('show');
            
            clearTimeout(resultTimeout);
            resultTimeout = setTimeout(() => {
                DOM.resultNotification.classList.remove('show');
            }, 1500);
        }

        function updateStats() {
            const total = scannedItems.length;
            const expired = scannedItems.filter(i => i.status.color === 'red').length;
            const warning = scannedItems.filter(i => i.status.color === 'yellow').length;
            
            DOM.totalCount.textContent = total;
            DOM.expiredCount.textContent = expired;
            DOM.warningCount.textContent = warning;
        }

        function updateRecentList() {
            const recent = scannedItems.slice(-5).reverse();
            
            let html = '<div style="font-weight: bold; margin-bottom: 4px;">Последние:</div>';
            
            recent.forEach(item => {
                html += `
                    <div class="recent-item ${item.status.class}">
                        <div>${item.status.emoji} ${item.status.days}д</div>
                        <div class="recent-gtin">${item.gtin ? item.gtin.substr(-6) : 'N/A'}</div>
                    </div>
                `;
            });
            
            DOM.recentList.innerHTML = html;
        }

        function playBeep(color) {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                if (color === 'red') {
                    oscillator.frequency.value = 400;
                    gainNode.gain.value = 0.3;
                    oscillator.start();
                    setTimeout(() => oscillator.stop(), 300);
                } else if (color === 'yellow') {
                    oscillator.frequency.value = 600;
                    gainNode.gain.value = 0.2;
                    oscillator.start();
                    setTimeout(() => oscillator.stop(), 150);
                } else {
                    oscillator.frequency.value = 800;
                    gainNode.gain.value = 0.2;
                    oscillator.start();
                    setTimeout(() => oscillator.stop(), 100);
                }
            } catch(e) {}
        }

        function openManual() {
            DOM.overlayBg.classList.add('show');
            DOM.manualModal.classList.add('show');
            checkGtinInDb();
        }

        function closeManual() {
            DOM.overlayBg.classList.remove('show');
            DOM.manualModal.classList.remove('show');
            DOM.dbHint.classList.remove('show');
        }

        function checkGtinInDb() {
            const gtin = DOM.manualGtin.value.trim();
            
            if (!gtin) {
                DOM.dbHint.classList.remove('show');
                return;
            }
            
            const normalized = normalizeGTIN(gtin);
            let found = false;
            let foundDate = '';
            
            for (const dbGtin in gtinDatabase) {
                if (normalizeGTIN(dbGtin) === normalized) {
                    found = true;
                    foundDate = gtinDatabase[dbGtin];
                    break;
                }
            }
            
            if (found) {
                DOM.dbHint.textContent = `✅ Этот GTIN уже в базе: ${foundDate}`;
                DOM.dbHint.classList.add('show');
                DOM.manualDate.value = foundDate;
            } else {
                DOM.dbHint.classList.remove('show');
            }
        }

        DOM.manualGtin.addEventListener('input', checkGtinInDb);

        function saveManual() {
            const gtin = DOM.manualGtin.value.trim();
            const dateStr = DOM.manualDate.value.trim();
            
            if (!gtin || !dateStr) {
                alert('Заполните оба поля!');
                return;
            }
            
            const dateMatch = dateStr.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
            if (!dateMatch) {
                alert('Формат: ДД.ММ.ГГГГ');
                return;
            }
            
            const day = parseInt(dateMatch[1]);
            const month = parseInt(dateMatch[2]) - 1;
            const year = parseInt(dateMatch[3]);
            const expDate = new Date(year, month, day);
            
            const normalizedGtin = normalizeGTIN(gtin);
            gtinDatabase[normalizedGtin] = dateStr;
            
            try {
                localStorage.setItem('gtinDatabase', JSON.stringify(gtinDatabase));
            } catch(e) {
                alert('Ошибка сохранения!');
                return;
            }
            
            const status = getColorStatus(expDate);
            const item = { 
                code: 'Ручной: ' + gtin, 
                gtin: normalizedGtin,
                date: expDate, 
                status: status, 
                source: 'ручной',
                time: new Date() 
            };
            scannedItems.push(item);
            showNotification(item);
            updateStats();
            updateRecentList();
            updateDbIndicator();
            
            closeManual();
            DOM.manualGtin.value = '';
            DOM.manualDate.value = '';
            
            showStatus(`✅ Сохранено! База: ${Object.keys(gtinDatabase).length}`);
        }

        function viewDatabase() {
            const entries = Object.entries(gtinDatabase);
            
            if (entries.length === 0) {
                DOM.dbViewContent.innerHTML = '<div class="db-empty">База пуста</div>';
            } else {
                let html = entries.map(([gtin, date]) => `
                    <div class="db-entry">
                        <div>
                            <div class="db-entry-gtin">${gtin}</div>
                            <div class="db-entry-date">до ${date}</div>
                        </div>
                        <button class="db-entry-delete" onclick="deleteFromDb('${gtin}')">Удалить</button>
                    </div>
                `).join('');
                DOM.dbViewContent.innerHTML = html;
            }
            
            DOM.overlayBg.classList.add('show');
            DOM.dbViewModal.classList.add('show');
        }

        function closeDbView() {
            DOM.overlayBg.classList.remove('show');
            DOM.dbViewModal.classList.remove('show');
        }

        function deleteFromDb(gtin) {
            if (confirm(`Удалить ${gtin} из базы?`)) {
                delete gtinDatabase[gtin];
                localStorage.setItem('gtinDatabase', JSON.stringify(gtinDatabase));
                updateDbIndicator();
                viewDatabase();
            }
        }

        function clearDatabase() {
            if (confirm('Удалить ВСЕ товары из базы?')) {
                gtinDatabase = {};
                localStorage.setItem('gtinDatabase', JSON.stringify(gtinDatabase));
                updateDbIndicator();
                closeDbView();
                showStatus('🗑️ База очищена');
            }
        }

        function exportDatabase() {
            const dataStr = JSON.stringify(gtinDatabase, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'gtin-database.json';
            link.click();
            URL.revokeObjectURL(url);
            showStatus('✅ База экспортирована!');
        }

        function importDatabase(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    gtinDatabase = { ...gtinDatabase, ...imported };
                    localStorage.setItem('gtinDatabase', JSON.stringify(gtinDatabase));
                    updateDbIndicator();
                    viewDatabase();
                    showStatus(`✅ Импортировано! База: ${Object.keys(gtinDatabase).length}`);
                } catch(err) {
                    alert('Ошибка импорта!');
                }
            };
            reader.readAsText(file);
        }

        DOM.overlayBg.addEventListener('click', () => {
            closeManual();
            closeDbView();
        });

        // Клик по индикатору базы
        DOM.dbIndicator.addEventListener('click', viewDatabase);

        // Инициализация
        updateDbIndicator();

        window.addEventListener('beforeunload', () => { if (isScanning) stopScanning(); });
    </script>
</body>
</html>
