<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сканер сроков годности</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
        }
        
        #reader { width: 100vw; height: 100vh; position: relative; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
        
        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            pointer-events: none;
            z-index: 10;
        }
        
        .scan-frame {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 3px solid rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
        }
        
        .scan-corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 4px solid #4caf50;
        }
        .scan-corner.top-left { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 10px 0 0 0; }
        .scan-corner.top-right { top: -2px; right: -2px; border-left: none; border-bottom: none; border-radius: 0 10px 0 0; }
        .scan-corner.bottom-left { bottom: -2px; left: -2px; border-right: none; border-top: none; border-radius: 0 0 0 10px; }
        .scan-corner.bottom-right { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 10px 0; }
        
        .scan-line {
            position: absolute;
            top: 50%; left: 10%; right: 10%;
            height: 2px;
            background: #4caf50;
            animation: scan 1.2s ease-in-out infinite;
        }
        @keyframes scan {
            0%, 100% { transform: translateY(-110px); }
            50% { transform: translateY(110px); }
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 8px;
            width: 95%;
            max-width: 500px;
        }
        
        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .btn-start { background: #4caf50; }
        .btn-stop { background: #f44336; }
        .btn-flash { background: #ff9800; }
        .btn-manual { background: #9c27b0; }
        
        .status-bar {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 10px 16px;
            border-radius: 15px;
            font-size: 13px;
        }
        
        .result-notification {
            position: fixed;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 12px 18px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            z-index: 200;
            display: none;
            min-width: 220px;
        }
        .result-notification.show { display: block; }
        
        .result-header { display: flex; align-items: center; gap: 10px; }
        
        .result-color {
            width: 45px;
            height: 45px;
            border-radius: 50%;
