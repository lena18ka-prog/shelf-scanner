<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сканер сроков годности</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
        }
        
        #reader { width: 100vw; height: 100vh; position: relative; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
        
        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            pointer-events: none;
            z-index: 10;
        }
        
        .scan-frame {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }
        
        .scan-corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 4px solid #4caf50;
        }
        .scan-corner.top-left { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 10px 0 0 0; }
        .scan-corner.top-right { top: -2px; right: -2px; border-left: none; border-bottom: none; border-radius: 0 10px 0 0; }
        .scan-corner.bottom-left { bottom: -2px; left: -2px; border-right: none; border-top: none; border-radius: 0 0 0 10px; }
        .scan-corner.bottom-right { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 10px 0; }
        
        .scan-line {
            position: absolute;
            top: 50%; left: 10%; right: 10%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #4caf50, transparent);
            animation: scan 2s ease-in-out infinite;
        }
        @keyframes scan {
            0%, 100% { transform: translateY(-80px); opacity: 0; }
            50% { transform: translateY(80px); opacity: 1; }
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
            width: 90%;
            max-width: 500px;
        }
        
        .action-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn-start { background: #4caf50; }
        .btn-stop { background: #f44336; }
        .btn-flash { background: #ff9800; }
        .btn-manual { background: #9c27b0; }
        
        .status-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
            max-width: 90%;
            text-align: center;
        }
        
        .result-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 200;
            display: none;
            min-width: 280px;
            text-align: center;
            max-width: 90%;
        }
        .result-popup.show { display: block; animation: popIn 0.3s; }
        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        
        .result-color {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }
        .result-color.green { background: #4caf50; }
        .result-color.yellow { background: #ff9800; }
        .result-color.red { background: #f44336; }
        
        .result-title { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .result-date { color: #666; font-size: 16px; margin-bottom: 5px; }
        .result-days { color: #999; font-size: 14px; }
        .result-gtin { color: #999; font-size: 12px; margin-top: 10px; word-break: break-all; }
        
        .close-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        
        .stats-panel {
            position: fixed;
            top: 80px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 100;
            font-size: 14px;
            display: none;
        }
        .stats-panel.show { display: block; }
        .stat-item { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 8px; }
        .stat-item:last-child { margin-bottom: 0; }
        .stat-label { color: #666; }
        .stat-value { font-weight: bold; }
        .stat-value.red { color: #f44336; }
        .stat-value.yellow { color: #ff9800; }
        
        .hint {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 100;
            text-align: center;
        }
        
        .zoom-controls {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .zoom-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        /* Модальное окно ручного ввода */
        .manual-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 300;
            display: none;
            min-width: 300px;
            max-width: 90%;
        }
        .manual-modal.show { display: block; }
        .manual-modal h3 { margin-bottom: 15px; font-size: 18px; }
        .manual-modal label { display: block; margin-bottom: 5px; font-size: 14px; color: #666; }
        .manual-modal input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .manual-modal .modal-buttons { display: flex; gap: 10px; }
        .manual-modal .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; color: white; }
        .btn-confirm { background: #4caf50; }
        .btn-cancel { background: #9e9e9e; }
        
        .overlay-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 250;
            display: none;
        }
        .overlay-bg.show { display: block; }
    </style>
</head>
<body>
    <div id="reader"></div>
    
    <div class="scan-overlay" id="scanOverlay" style="display: none;">
        <div class="scan-frame"></div>
        <div class="scan-corner top-left"></div>
        <div class="scan-corner top-right"></div>
        <div class="scan-corner bottom-left"></div>
        <div class="scan-corner bottom-right"></div>
        <div class="scan-line"></div>
    </div>
    
    <div class="status-bar" id="statusBar">Нажмите "Включить камеру"</div>
    
    <div class="hint" id="hint" style="display: none;">
        📏 Держите 10-15 см от кода<br>
        💡 Включите вспышку для лучшего результата
    </div>
    
    <div class="stats-panel" id="statsPanel">
        <div class="stat-item">
            <span class="stat-label">Всего:</span>
            <span class="stat-value" id="totalCount">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Просрочено:</span>
            <span class="stat-value red" id="expiredCount">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Скоро:</span>
            <span class="stat-value yellow" id="warningCount">0</span>
        </div>
    </div>
    
    <div class="zoom-controls" id="zoomControls" style="display: none;">
        <button class="zoom-btn" onclick="changeZoom(0.5)">+</button>
        <button class="zoom-btn" onclick="changeZoom(-0.5)">−</button>
    </div>
    
    <div class="result-popup" id="resultPopup">
        <div class="result-color" id="resultColor"></div>
        <div class="result-title" id="resultTitle"></div>
        <div class="result-date" id="resultDate"></div>
        <div class="result-days" id="resultDays"></div>
        <div class="result-gtin" id="resultGtin"></div>
        <button class="close-btn" onclick="closeResult()">Продолжить</button>
    </div>
    
    <div class="controls">
        <button class="action-btn btn-start" id="startBtn" onclick="toggleScan()">📷 Включить</button>
        <button class="action-btn btn-flash" id="flashBtn" onclick="toggleFlash()" style="display: none;">💡 Вспышка</button>
        <button class="action-btn btn-manual" id="manualBtn" onclick="openManual()" style="display: none;">✏️ Вручную</button>
    </div>
    
    <!-- Модальное окно ручного ввода -->
    <div class="overlay-bg" id="overlayBg"></div>
    <div class="manual-modal" id="manualModal">
        <h3>✏️ Ввести срок годности вручную</h3>
        <label>GTIN товара:</label>
        <input type="text" id="manualGtin" placeholder="Например: 0460060503352">
        <label>Срок годности (ДД.ММ.ГГГГ):</label>
        <input type="text" id="manualDate" placeholder="Например: 25.07.2026">
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeManual()">Отмена</button>
            <button class="btn-confirm" onclick="saveManual()">Сохранить</button>
        </div>
    </div>

    <script>
        let html5QrcodeScanner;
        let isScanning = false;
        let scannedItems = [];
        let currentZoom = 1;
        let isFlashOn = false;
        let lastScannedCode = null;
        
        // Локальная база GTIN → срок годности (сохраняется в браузере)
        let gtinDatabase = JSON.parse(localStorage.getItem('gtinDatabase') || '{}');

        function showStatus(message) {
            document.getElementById('statusBar').textContent = message;
        }

        // Извлечение GTIN из кода (тег 01, 14 цифр)
        function extractGTIN(rawData) {
            const match = rawData.match(/01(\d{14})/);
            if (match) return match[1];
            const match13 = rawData.match(/01(\d{13})/);
            if (match13) return match13[1];
            return null;
        }

        // Поиск даты в коде (несколько форматов)
        function parseDataMatrix(rawData) {
            // 1. Тег 17 (стандартный срок годности GS1)
            const match17 = rawData.match(/17(\d{6})/);
            if (match17) {
                const dateStr = match17[1];
                const year = parseInt(dateStr.substr(0, 2)) + 2000;
                const month = parseInt(dateStr.substr(2, 2)) - 1;
                const day = parseInt(dateStr.substr(4, 2));
                return { date: new Date(year, month, day), source: 'тег 17' };
            }
            
            // 2. Тег 91 (если содержит 6 цифр)
            const match91 = rawData.match(/91(\d{6})/);
            if (match91) {
                const dateStr = match91[1];
                const year = parseInt(dateStr.substr(0, 2)) + 2000;
                const month = parseInt(dateStr.substr(2, 2)) - 1;
                const day = parseInt(dateStr.substr(4, 2));
                if (year >= 2020 && year <= 2030 && month >= 0 && month <= 11 && day >= 1 && day <= 31) {
                    return { date: new Date(year, month, day), source: 'тег 91' };
                }
            }
            
            // 3. Поиск в локальной базе по GTIN
            const gtin = extractGTIN(rawData);
            if (gtin && gtinDatabase[gtin]) {
                const parts = gtinDatabase[gtin].split('.');
                if (parts.length === 3) {
                    const day = parseInt(parts[0]);
                    const month = parseInt(parts[1]) - 1;
                    const year = parseInt(parts[2]);
                    return { date: new Date(year, month, day), source: 'база данных' };
                }
            }
            
            return null;
        }

        function getColorStatus(expirationDate) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const diffTime = expirationDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays <= 0) return { color: 'red', label: '🔴 Просрочен', emoji: '🔴', class: 'red', days: diffDays };
            else if (diffDays <= 2) return { color: 'yellow', label: '⚠️ Истекает', emoji: '⚠️', class: 'yellow', days: diffDays };
            else return { color: 'green', label: '🟢 Нормально', emoji: '✅', class: 'green', days: diffDays };
        }

        async function toggleScan() {
            if (isScanning) stopScanning();
            else await startScanning();
        }

        async function startScanning() {
            if (typeof Html5Qrcode === 'undefined') {
                showStatus('⚠️ Библиотека не загружена');
                return;
            }
            
            showStatus('📡 Запуск камеры...');
            
            try {
                isScanning = true;
                document.getElementById('startBtn').textContent = '⏹️ Выключить';
                document.getElementById('startBtn').classList.remove('btn-start');
                document.getElementById('startBtn').classList.add('btn-stop');
                document.getElementById('scanOverlay').style.display = 'block';
                document.getElementById('hint').style.display = 'block';
                document.getElementById('statsPanel').classList.add('show');
                document.getElementById('zoomControls').style.display = 'flex';
                document.getElementById('flashBtn').style.display = 'block';
                document.getElementById('manualBtn').style.display = 'block';
                
                html5QrcodeScanner = new Html5Qrcode("reader");
                
                const config = { 
                    fps: 20,
                    qrbox: { width: 200, height: 200 },
                    aspectRatio: 1.0,
                    disableFlip: false,
                    videoConstraints: {
                        facingMode: 'environment',
                        width: { ideal: 2560 },
                        height: { ideal: 1440 },
                        focusMode: 'macro'
                    }
                };
                
                await html5QrcodeScanner.start(
                    { facingMode: "environment" },
                    config,
                    onScanSuccess,
                    onScanFailure
                );
                
                showStatus('✅ Камера активна. Держите 10-15 см');
                
            } catch (err) {
                console.error('Ошибка:', err);
                isScanning = false;
                document.getElementById('startBtn').textContent = '📷 Включить';
                showStatus('❌ Ошибка: ' + err.message);
            }
        }

        function stopScanning() {
            isScanning = false;
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => { 
                    html5QrcodeScanner.clear(); 
                    html5QrcodeScanner = null;
                });
            }
            document.getElementById('startBtn').textContent = ' Включить';
            document.getElementById('startBtn').classList.remove('btn-stop');
            document.getElementById('startBtn').classList.add('btn-start');
            document.getElementById('scanOverlay').style.display = 'none';
            document.getElementById('hint').style.display = 'none';
            document.getElementById('statsPanel').classList.remove('show');
            document.getElementById('zoomControls').style.display = 'none';
            document.getElementById('flashBtn').style.display = 'none';
            document.getElementById('manualBtn').style.display = 'none';
            showStatus('Камера выключена');
        }

        function changeZoom(delta) {
            currentZoom += delta;
            if (currentZoom < 1) currentZoom = 1;
            if (currentZoom > 3) currentZoom = 3;
            showStatus(`🔍 Зум: ${currentZoom.toFixed(1)}x`);
            
            if (html5QrcodeScanner && html5QrcodeScanner.getRunningTrackCapabilities) {
                const capabilities = html5QrcodeScanner.getRunningTrackCapabilities();
                if (capabilities.zoom) {
                    html5QrcodeScanner.applyVideoConstraints({
                        advanced: [{ zoom: currentZoom }]
                    });
                }
            }
        }

        function toggleFlash() {
            isFlashOn = !isFlashOn;
            document.getElementById('flashBtn').textContent = isFlashOn ? '💡 Выключить' : '💡 Вспышка';
            
            if (html5QrcodeScanner) {
                html5QrcodeScanner.applyVideoConstraints({
                    advanced: [{ torch: isFlashOn }]
                });
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Защита от повторного сканирования того же кода подряд
            if (lastScannedCode === decodedText) return;
            lastScannedCode = decodedText;
            
            const gtin = extractGTIN(decodedText);
            const parsed = parseDataMatrix(decodedText);
            
            if (parsed) {
                const status = getColorStatus(parsed.date);
                const item = { 
                    code: decodedText, 
                    gtin: gtin,
                    date: parsed.date, 
                    status: status, 
                    source: parsed.source,
                    time: new Date() 
                };
                scannedItems.push(item);
                showResult(item);
                updateStats();
                
                if (navigator.vibrate) {
                    if (status.color === 'red') navigator.vibrate([200, 100, 200]);
                    else if (status.color === 'yellow') navigator.vibrate(100);
                    else navigator.vibrate(50);
                }
            } else {
                // Дата не найдена — предлагаем ввести вручную
                showStatus('📦 Дата не найдена. Нажмите "Вручную"');
                
                // Автозаполнение GTIN в модальном окне
                if (gtin) {
                    document.getElementById('manualGtin').value = gtin;
                }
                
                setTimeout(() => { 
                    if (isScanning) showStatus('✅ Камера активна'); 
                }, 3000);
            }
        }

        function onScanFailure(error) { }

        function showResult(item) {
            const popup = document.getElementById('resultPopup');
            const color = document.getElementById('resultColor');
            const title = document.getElementById('resultTitle');
            const date = document.getElementById('resultDate');
            const days = document.getElementById('resultDays');
            const gtinEl = document.getElementById('resultGtin');
            
            const dateStr = item.date.toLocaleDateString('ru-RU');
            
            color.className = 'result-color ' + item.status.class;
            color.textContent = item.status.emoji;
            title.textContent = item.status.label;
            date.textContent = 'Срок: ' + dateStr + ' (из ' + item.source + ')';
            days.textContent = 'Осталось: ' + item.status.days + ' дн.';
            gtinEl.textContent = item.gtin ? 'GTIN: ' + item.gtin : '';
            
            popup.classList.add('show');
        }

        function closeResult() {
            document.getElementById('resultPopup').classList.remove('show');
            lastScannedCode = null; // Сброс для повторного сканирования
        }

        function updateStats() {
            const total = scannedItems.length;
            const expired = scannedItems.filter(i => i.status.color === 'red').length;
            const warning = scannedItems.filter(i => i.status.color === 'yellow').length;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('expiredCount').textContent = expired;
            document.getElementById('warningCount').textContent = warning;
        }

        // Ручной ввод срока годности
        function openManual() {
            document.getElementById('overlayBg').classList.add('show');
            document.getElementById('manualModal').classList.add('show');
        }

        function closeManual() {
            document.getElementById('overlayBg').classList.remove('show');
            document.getElementById('manualModal').classList.remove('show');
        }

        function saveManual() {
            const gtin = document.getElementById('manualGtin').value.trim();
            const dateStr = document.getElementById('manualDate').value.trim();
            
            if (!gtin || !dateStr) {
                alert('Заполните оба поля!');
                return;
            }
            
            // Проверка формата даты
            const dateMatch = dateStr.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
            if (!dateMatch) {
                alert('Неверный формат даты! Используйте ДД.ММ.ГГГГ');
                return;
            }
            
            const day = parseInt(dateMatch[1]);
            const month = parseInt(dateMatch[2]) - 1;
            const year = parseInt(dateMatch[3]);
            const expDate = new Date(year, month, day);
            
            // Сохраняем в локальную базу
            gtinDatabase[gtin] = dateStr;
            localStorage.setItem('gtinDatabase', JSON.stringify(gtinDatabase));
            
            // Показываем результат
            const status = getColorStatus(expDate);
            const item = { 
                code: 'Ручной ввод: ' + gtin, 
                gtin: gtin,
                date: expDate, 
                status: status, 
                source: 'ручной ввод',
                time: new Date() 
            };
            scannedItems.push(item);
            showResult(item);
            updateStats();
            
            closeManual();
            
            // Очистка полей
            document.getElementById('manualGtin').value = '';
            document.getElementById('manualDate').value = '';
            
            showStatus('✅ Сохранено в базу!');
        }

        window.addEventListener('beforeunload', () => { if (isScanning) stopScanning(); });
    </script>
</body>
</html>
